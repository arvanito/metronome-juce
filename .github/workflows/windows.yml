# Builds and tests the Windows app on every push; the Release exe is attached to the run.
name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # the web UI lives in web/
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v6
        with:
          path: ~/.builds/metronome-juce/deps
          key: deps-${{ hashFiles('CMakeLists.txt') }}
      - run: cmake --preset windows
      - run: cmake --build --preset debug --target MetronomeTests
      - run: ctest --preset debug
      - run: cmake --build --preset release --target Metronome
      - uses: actions/upload-artifact@v7
        with:
          name: Metronome-windows
          path: ~/.builds/metronome-juce/build/Metronome_artefacts/Release/Metronome.exe
